<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="오늘 할 일을 가볍게 정리하는 Kiwibird 할 일 관리 앱">
  <title>Kiwibird</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app-shell">
    <header class="hero">
      <div class="brand-mark" aria-hidden="true">
        <span class="bird-eye"></span>
      </div>
      <div>
        <p class="eyebrow">MY DAILY NEST</p>
        <h1>Kiwibird</h1>
        <p class="tagline">오늘 할 일을 가볍게 정리해요.</p>
      </div>
      <button id="theme-toggle" class="theme-toggle" type="button" aria-label="다크 모드로 전환">다크 모드</button>
    </header>

    <section class="dashboard" aria-labelledby="dashboard-title">
      <div class="dashboard-copy">
        <p class="eyebrow">KIWIBIRD NEST</p>
        <h2 id="dashboard-title">오늘의 둥지</h2>
        <p id="nest-message" class="nest-message">할 일을 하나씩 완료해 둥지를 채워 보세요.</p>

        <dl class="summary-grid">
          <div><dt>오늘 마감</dt><dd id="today-count">0</dd></div>
          <div><dt>남은 일</dt><dd id="remaining-count">0</dd></div>
          <div><dt>완료</dt><dd id="completed-count">0</dd></div>
          <div><dt>기한 지남</dt><dd id="overdue-count">0</dd></div>
        </dl>

        <div class="progress-heading">
          <label for="overall-progress">전체 완료율</label>
          <strong id="progress-label">0%</strong>
        </div>
        <progress id="overall-progress" max="100" value="0">0%</progress>
      </div>

      <div id="nest-scene" class="nest-scene stage-empty" role="img" aria-label="빈 둥지">
        <span class="nest-leaf leaf-one"></span>
        <span class="nest-leaf leaf-two"></span>
        <span class="nest-egg"></span>
        <span class="nest-bird"><span class="nest-bird-eye"></span></span>
        <span class="nest-bowl"></span>
      </div>

      <div class="category-progress-section">
        <h3>카테고리별 완료율</h3>
        <div id="category-progress-list" class="category-progress-list"></div>
      </div>
    </section>

    <section class="focus-card" aria-labelledby="focus-title">
      <div class="focus-heading">
        <div>
          <p class="eyebrow">KIWIBIRD FOCUS</p>
          <h2 id="focus-title">지금 집중할 일</h2>
        </div>
        <span class="focus-count">오늘 집중 <strong id="focus-count">0</strong>회</span>
      </div>

      <div class="focus-recommendation">
        <strong id="focus-task">추천할 할 일이 아직 없어요.</strong>
        <span id="focus-reason">미완료 할 일을 추가하면 우선순위에 맞춰 추천해 드려요.</span>
      </div>

      <output id="timer-display" class="timer-display" aria-live="polite">25:00</output>

      <div class="focus-settings">
        <div class="quick-times" aria-label="빠른 집중 시간 선택">
          <button type="button" data-minutes="15">15분</button>
          <button type="button" data-minutes="25" class="selected">25분</button>
          <button type="button" data-minutes="45">45분</button>
        </div>
        <div class="duration-field">
          <label for="focus-duration">직접 설정</label>
          <div><input id="focus-duration" type="number" min="5" max="120" step="1" value="25"> <span>분</span></div>
        </div>
      </div>

      <div class="timer-actions">
        <button id="timer-start" type="button" class="primary-button">집중 시작</button>
        <button id="timer-pause" type="button" class="secondary-button" hidden>일시정지</button>
        <button id="timer-resume" type="button" class="primary-button" hidden>계속하기</button>
        <button id="timer-stop" type="button" class="danger-button" hidden>종료</button>
      </div>
      <p id="focus-status" class="status-message" role="status" aria-live="polite"></p>
    </section>

    <section class="task-card" aria-labelledby="task-form-title">
      <h2 id="task-form-title">새 할 일</h2>
      <form id="task-form" novalidate>
        <label for="task-input">무엇을 해야 하나요?</label>
        <div class="input-row">
          <input
            id="task-input"
            name="task"
            type="text"
            maxlength="100"
            placeholder="예: 과제 제출하기"
            autocomplete="off"
          >
        </div>

        <div class="field-grid">
          <div>
            <label for="category-input">카테고리</label>
            <select id="category-input" name="category">
              <option value="업무">업무</option>
              <option value="과제" selected>과제</option>
              <option value="공부">공부</option>
              <option value="취미">취미</option>
              <option value="개발">개발</option>
              <option value="개인">개인</option>
            </select>
          </div>
          <div>
            <label for="due-date-input">마감일 <span class="optional-label">선택</span></label>
            <input id="due-date-input" name="dueDate" type="date">
          </div>
          <div>
            <label for="priority-input">중요도</label>
            <select id="priority-input" name="priority">
              <option value="낮음">낮음</option>
              <option value="보통" selected>보통</option>
              <option value="높음">높음</option>
            </select>
          </div>
        </div>
        <div class="form-actions">
          <button id="cancel-edit-button" type="button" class="secondary-button" hidden>수정 취소</button>
          <button id="submit-button" type="submit" class="primary-button">할 일 추가</button>
        </div>
      </form>
      <p id="status-message" class="status-message" role="status" aria-live="polite"></p>
    </section>

    <section class="task-card" aria-labelledby="task-list-title">
      <div class="section-heading">
        <div>
          <p class="eyebrow">TODAY</p>
          <h2 id="task-list-title">할 일 목록</h2>
        </div>
        <button id="clear-completed" class="danger-button" type="button">완료 항목 삭제</button>
      </div>

      <div class="filter-toolbar" aria-label="할 일 검색과 필터">
        <div class="search-field">
          <label for="search-input">할 일 검색</label>
          <input id="search-input" type="search" placeholder="검색어 입력 (/)">
        </div>
        <div class="filter-field">
          <label for="status-filter">상태</label>
          <select id="status-filter">
            <option value="전체">전체</option>
            <option value="진행 중">진행 중</option>
            <option value="완료">완료</option>
            <option value="기한 지남">기한 지남</option>
          </select>
        </div>
        <div class="filter-field">
          <label for="category-filter">카테고리 보기</label>
          <select id="category-filter">
            <option value="전체">전체</option>
            <option value="업무">업무</option>
            <option value="과제">과제</option>
            <option value="공부">공부</option>
            <option value="취미">취미</option>
            <option value="개발">개발</option>
            <option value="개인">개인</option>
          </select>
        </div>
        <div class="filter-field">
          <label for="sort-filter">정렬</label>
          <select id="sort-filter">
            <option value="recent">최근 등록순</option>
            <option value="deadline">마감일순</option>
            <option value="priority">중요도순</option>
          </select>
        </div>
        <button id="reset-filters" class="secondary-button" type="button">조건 초기화</button>
      </div>

      <p id="empty-state" class="empty-state">
        <strong id="empty-title">아직 등록한 할 일이 없어요.</strong>
        <span id="empty-description">오늘 해야 할 일을 하나 적어 보세요.</span>
      </p>
      <ul id="task-list" class="task-list" aria-label="등록한 할 일"></ul>
    </section>
  </main>

  <script src="script.js?v=4"></script>
</body>
</html>
